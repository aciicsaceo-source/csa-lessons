<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSA Lesson Player</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://scratchblocks.github.io/scratchblocks/scratchblocks.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-kicker">COGNITIVE SYSTEMS ACADEMY™</div>
        <div id="lessonTitle" class="brand-title">Loading…</div>
      </div>
      <div class="top-actions">
        <select id="levelSelector" class="level-selector">
          <option value="basic">Basic</option>
          <option value="standard">Standard</option>
          <option value="advanced">Advanced</option>
        </select>
        <a class="btn" target="_blank" rel="noopener" href="https://scratch.mit.edu/projects/editor/">Open Scratch</a>
        <button id="restartBtn" class="btn secondary" type="button">Restart Level</button>
      </div>
    </header>

    <main class="grid">
      <section class="left" id="leftPanel">
        <canvas id="cortexCanvas" class="cortex"></canvas>

        <div class="bubble" id="bubble">
          <div class="bubble-text" id="bubbleText">Loading…</div>
        </div>

        <div class="companion">
          <div class="logo-wrap">
            <img id="csaLogo" class="csa-logo" src="csa_logo_jelly.jpeg" alt="CSA logo" />
            <div class="eyes-container" id="eyesContainer">
              <div class="eye left-eye">
                <div class="pupil"></div>
              </div>
              <div class="eye right-eye">
                <div class="pupil"></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="progress-wrap">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div class="step-card">
          <div class="step-header">
            <div id="stepPill" class="pill">Step</div>
            <h2 id="stepTitle" class="step-title">Loading…</h2>
          </div>

          <div class="step-body">
            <div class="visual-container">
              <div class="zoom-controls hidden" id="zoomControls">
                <button id="zoomOutBtn" class="zoom-btn" type="button">−</button>
                <span id="zoomLevel">100%</span>
                <button id="zoomInBtn" class="zoom-btn" type="button">+</button>
                <button id="zoomResetBtn" class="zoom-btn-reset" type="button">Fit</button>
              </div>
              <div class="visual-scroll">
                <div id="blocksSvg" class="blocks"></div>
                <div id="blocksStatus" class="blocks-status hidden"></div>
                <div id="blocksFallback" class="blocks-fallback hidden"></div>
              </div>
            </div>

            <div id="hintBox" class="hintbox hidden" aria-live="polite">
              <div class="hintbox-title">Hint</div>
              <div id="hintText" class="hintbox-text"></div>
            </div>

            <div class="controls">
              <button id="backBtn" class="btn secondary" type="button">← Back</button>
              <button id="hintBtn" class="btn secondary" type="button">Hint</button>

              <div class="spacer"></div>

              <button id="completeBtn" class="btn success hidden" type="button">Complete Level ✓</button>
              <button id="nextBtn" class="btn primary" type="button">Next →</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
